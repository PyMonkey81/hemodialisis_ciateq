[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemodialisis-ciateq"
version = "1.2.0"
description = "Máquina de Hemodiálisis - CIATEQ"
requires-python = ">=3.11,<3.13"
dependencies = [
	"crcmod==1.7",
	"numpy==2.4.1",
	"pandas==3.0.0",
	"pyqtgraph==0.14.0",
	"pyserial==3.5",
	"PySide6==6.10.1",
	"python-dateutil==2.9.0.post0",
	"pefile==2024.8.26; platform_system == 'Windows'",
	"pywin32-ctypes==0.2.3; platform_system == 'Windows'",
]

[tool.setuptools]
py-modules = ["main"]
